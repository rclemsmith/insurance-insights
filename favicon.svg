<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B3D"/>
      <stop offset="100%" stop-color="#0A2A5C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A43"/>
      <stop offset="100%" stop-color="#E4002B"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Analytics Chart Bars -->
  <rect x="15" y="34" width="7" height="15" rx="3.5" fill="#94A3B8"/>
  <rect x="26" y="25" width="7" height="24" rx="3.5" fill="#FFFFFF"/>
  <rect x="37" y="16" width="7" height="33" rx="3.5" fill="url(#accent)"/>

  <!-- Pulse / Growth Indicator Dot -->
  <circle cx="48" cy="18" r="3.5" fill="#10B981"/>
</svg>
